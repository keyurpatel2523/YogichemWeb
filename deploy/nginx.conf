# /etc/nginx/sites-available/yogichem
# After editing: sudo ln -s /etc/nginx/sites-available/yogichem /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
# Run certbot AFTER this is live on port 80 to provision the SSL block below.

server {
    listen 80;
    listen [::]:80;
    server_name yogichem.co.uk www.yogichem.co.uk;

    client_max_body_size 10M;

    # Uploaded product images — served directly by Nginx, bypassing Node.
    location /uploads/ {
        alias /var/www/yogichem/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static build assets — long-lived cache, content-hashed filenames.
    location /_next/static/ {
        alias /var/www/yogichem/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# After running: sudo certbot --nginx -d yogichem.co.uk -d www.yogichem.co.uk
# certbot will rewrite this file to add the listen 443 ssl block and a
# 80 -> 443 redirect automatically. No manual edits needed beforehand.
